[pytest]
# Büyük İK dataset test paketi
minversion = 7.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
markers =
    slow: üreticiyi alt süreçte koşan yavaş testler (pytest -m "not slow" ile atlanır)
    statistical: dağılım/oran temelli testler (üretim parametrelerine duyarlı)
filterwarnings =
    error
